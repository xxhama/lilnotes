<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LilNotes</title>
    <script>
      (function () {
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <style>
      /* Inline critical CSS — renders instantly before the JS bundle loads.
         Matches the app's theme tokens (oklch → hex approximations).
         React replaces #root's children on mount, so the splash disappears. */
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: #fafaf9;
        color: #1c1c1e;
      }
      html.dark body {
        background: #1c1c1e;
        color: #fafaf9;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      }
      .splash__logo {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        object-fit: contain;
      }
      .splash__spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(0, 0, 0, 0.1);
        border-top-color: #1c1c1e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      html.dark .splash__spinner {
        border-color: rgba(255, 255, 255, 0.15);
        border-top-color: #fafaf9;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="splash">
        <img class="splash__logo" src="/logo.png" alt="LilNotes" />
        <div class="splash__spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
