# Conventional prefixes so Dependabot PR titles pass the PR title check
# (pr-title.yml) and land on main as `chore(deps): …` / `ci(deps): …`, which
# never trigger a release on their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "ci(deps)"
    schedule:
      interval: weekly
