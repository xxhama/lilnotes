name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  rust:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Install meson/ninja (webrtc-audio-processing build deps)
        run: brew install meson ninja pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # cache-directories: sherpa-rs-sys downloads the prebuilt sherpa-onnx /
      # onnxruntime libs into ~/Library/Caches/sherpa-rs and the linker search
      # path points there. Without caching that dir, a restored target/ (build
      # script "fresh") + missing lib dir breaks linking for any NEW binary or
      # example target. prefix-key v1 busted the poisoned pre-existing cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v1-rust
          cache-directories: ~/Library/Caches/sherpa-rs
      - run: cargo fmt --check
      # The lilnotes build script (tauri_build) validates that the
      # `binaries/llama-server-<triple>` sidecar resource declared in
      # tauri.conf.json (bundle.externalBin) exists — even for clippy/test,
      # not just `tauri build`. Build it before the cargo commands that
      # compile the crate. Cached so the multi-minute llama.cpp CMake build
      # only runs on cache miss; the key includes the pinned llama.cpp ref
      # (b9957) via the build script hash, so a ref bump busts the cache.
      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: |
            .llama.cpp
            src-tauri/binaries
          key: llama-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-llama-server.sh') }}
      - name: Build llama-server sidecar
        run: bash ${{ github.workspace }}/scripts/build-llama-server.sh
      - run: cargo clippy -- -D warnings
      # A full-match target/ restore marks the sherpa-rs-sys build script
      # fresh, so it never re-copies its dylibs into target/debug — but
      # rust-cache prunes them from the saved cache, and the test binaries'
      # @rpath only searches target/debug{,/deps} at runtime. Re-materialize
      # them from the cached download dir so `cargo test` binaries can load.
      # No-op on a fresh build (the build script copies them itself; -n keeps
      # the fresh copies).
      - name: Restore sherpa dylibs into target/debug
        run: |
          mkdir -p target/debug
          find ~/Library/Caches/sherpa-rs -name '*.dylib' -exec cp -n {} target/debug/ \; || true
      - run: cargo test
