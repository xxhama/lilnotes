name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger: re-prime the caches on main after an idle stretch (GitHub
  # evicts any cache not accessed in 7 days, so the first run after a pause is
  # a cold ~7 min build).
  workflow_dispatch:

# A new push to the same branch/PR cancels the still-running previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  rust:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    env:
      # Dependency artifacts with full debug info dominate the ~1 GB target/
      # cache. Line tables keep file:line in test backtraces at a fraction of
      # the size and compile time. (rust-cache hashes CARGO_* env vars into its
      # key, so changing this rolls the cache once.)
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5
      - name: Install meson/ninja (webrtc-audio-processing build deps)
        run: brew install meson ninja pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # cache-directories: sherpa-rs-sys downloads the prebuilt sherpa-onnx /
      # onnxruntime libs into ~/Library/Caches/sherpa-rs and the linker search
      # path points there. Without caching that dir, a restored target/ (build
      # script "fresh") + missing lib dir breaks linking for any NEW binary or
      # example target. prefix-key v1 busted the poisoned pre-existing cache.
      #
      # cache-on-failure: a failed clippy/test run still compiled every
      # dependency; keep that work so the fix-up push starts warm instead of
      # paying the full ~8 min again.
      #
      # Note: caches saved from a PR are only visible to that PR; main can only
      # read main's caches. PRs fall back to main's cache via restore-keys.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v1-rust
          cache-directories: ~/Library/Caches/sherpa-rs
          cache-on-failure: true
      - run: cargo fmt --check
      # The lilnotes build script (tauri_build) validates that the
      # `binaries/llama-server-<triple>` sidecar declared in tauri.conf.json
      # (bundle.externalBin) exists — even for clippy/test, not just
      # `tauri build`. It only checks that the path is a file and copies it, and
      # no unit test spawns the sidecar, so an empty executable stub is enough
      # here. The real llama.cpp build (~3 min) happens in the `sidecar` job
      # below (main only) and in the Release workflow.
      - name: Stub llama-server sidecar (tauri_build only checks the file exists)
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p binaries
          if [ ! -f "binaries/llama-server-$TRIPLE" ]; then
            : > "binaries/llama-server-$TRIPLE"
            chmod +x "binaries/llama-server-$TRIPLE"
          fi
      # --all-targets: tests, examples and mcp/tests.rs are linted too.
      - run: cargo clippy --all-targets -- -D warnings
      # A full-match target/ restore marks the sherpa-rs-sys build script
      # fresh, so it never re-copies its dylibs into target/debug — but
      # rust-cache prunes them from the saved cache, and the test binaries'
      # @rpath only searches target/debug{,/deps} at runtime. Re-materialize
      # them from the cached download dir so `cargo test` binaries can load.
      # No-op on a fresh build (the build script copies them itself; -n keeps
      # the fresh copies).
      - name: Restore sherpa dylibs into target/debug
        run: |
          mkdir -p target/debug
          find ~/Library/Caches/sherpa-rs -name '*.dylib' -exec cp -n {} target/debug/ \; || true
      - run: cargo test

  # License policy: every Rust dependency must carry an allowlisted license
  # (src-tauri/deny.toml), and THIRD_PARTY_NOTICES.md must match what
  # scripts/gen-third-party-notices.sh produces from the current lockfiles.
  # Both tools read Cargo.lock only — nothing is compiled — so this runs on
  # Linux in about a minute. Tool versions are pinned so the generated text
  # is byte-stable across runs.
  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2
      - run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses
      - run: bash scripts/gen-third-party-notices.sh
      - name: THIRD_PARTY_NOTICES.md is up to date
        run: |
          if ! git diff --exit-code THIRD_PARTY_NOTICES.md; then
            echo "::error::THIRD_PARTY_NOTICES.md is stale. Run 'bash scripts/gen-third-party-notices.sh' (brew install cargo-about) and commit the result."
            exit 1
          fi

  # Keeps the llama.cpp sidecar build cached on the default branch so the
  # Release workflow (which can read main's caches) gets a hit instead of
  # rebuilding llama.cpp from source. Runs in parallel with `rust`, so it never
  # extends PR/main wall time; on a cache hit it finishes in ~30 s. The key
  # includes the pinned llama.cpp ref (via the build script hash), so a ref
  # bump rebuilds and re-caches.
  sidecar:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache llama.cpp build
        id: llama
        uses: actions/cache@v5
        with:
          path: |
            .llama.cpp
            src-tauri/binaries
          key: llama-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-llama-server.sh') }}
      - name: Build llama-server sidecar
        if: steps.llama.outputs.cache-hit != 'true'
        run: bash scripts/build-llama-server.sh
