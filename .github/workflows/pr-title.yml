name: PR title

# PRs are squash-merged, so the PR title becomes the commit on main that
# release-please reads to pick the version bump and write the changelog. A
# title without a Conventional Commits type is silently left out of both.
#
# Separate from ci.yml so that editing a title re-runs only this check, not
# the macOS build (and does not cancel a CI run in progress).

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Title follows Conventional Commits
        env:
          # Via env, never inlined into the script: the title is untrusted.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
            exit 0
          fi
          echo "::error::PR title is not a Conventional Commit: \"$TITLE\""
          echo "Use '<type>: <summary>' or '<type>(<scope>): <summary>', e.g. 'fix: stop the tray icon flickering'."
          echo "Types: feat (minor release); fix, perf, revert (patch release); feat!/fix! (breaking);"
          echo "       docs, chore, ci, refactor, test, build, style (no release)."
          echo "See the 'Commits and pull requests' section of CONTRIBUTING.md."
          exit 1
