name: Release

# Fully automated releases via release-please (conventional commits):
#
#   1. Every push to main runs release-please. When there are releasable
#      commits since the last tag (`feat:` → minor, `fix:` → patch, `feat!:`
#      → minor while < 1.0), it opens/updates a "chore(main): release X.Y.Z"
#      PR that bumps every version file (package.json, package-lock.json,
#      src-tauri/tauri.conf.json, Cargo.toml, Cargo.lock) and CHANGELOG.md.
#      Config: release-please-config.json + .release-please-manifest.json.
#   2. Merging that PR runs release-please again; it tags vX.Y.Z and publishes
#      the GitHub Release right away, and the `build` job below builds the DMG,
#      uploads it + checksums, and appends the install notes (~10 min window
#      without assets). The release must NOT be a draft: a draft has no git
#      tag, so the next release-please run would not see it as the latest
#      release and would open a bogus follow-up release PR.
#   3. `workflow_dispatch` with an existing tag rebuilds and re-uploads the
#      assets for that release (e.g. after a build-script fix).
#
# Token: `RELEASE_PLEASE_TOKEN` (fine-grained PAT, contents + pull-requests
# write) is optional. With the default GITHUB_TOKEN the release PR is created
# fine but gets NO CI run (GitHub never triggers workflows on events made by
# GITHUB_TOKEN); the PR only touches version files + CHANGELOG. The repo
# setting "Allow GitHub Actions to create and approve pull requests" must be
# enabled for the GITHUB_TOKEN path.
#
# Signing: when the MACOS_CERT_P12 secret is present the build imports the
# Developer ID certificate into a throwaway keychain and scripts/fix-bundle.sh
# signs with the hardened runtime, notarizes with an App Store Connect API
# key and staples the .app and .dmg. Without the secret (forks, or before
# the secrets are configured) the exact same pipeline produces an ad-hoc
# signed DMG and the release notes carry the Gatekeeper workaround instead.
# Secrets (all optional, all-or-nothing):
#   MACOS_CERT_P12        base64 of the "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD   password of that .p12
#   MACOS_SIGN_IDENTITY   e.g. "Developer ID Application: Name (TEAMID)"
#   NOTARY_KEY_P8         base64 of the App Store Connect API key (.p8)
#   NOTARY_KEY_ID         its Key ID
#   NOTARY_ISSUER_ID      its Issuer ID
# Deliberately not the APPLE_* names Tauri's bundler reads: Tauri would sign
# and notarize before fix-bundle.sh adds the dylibs, wasting the effort.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild assets for (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

# Never run two release-please/build pipelines at once; queue instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  # release-please bumps Cargo.toml but cannot address the
  # `[[package]] name = "lilnotes"` entry in Cargo.lock (its TOML updater has
  # no filter support), so regenerate that one entry with cargo on the
  # release PR branch. `cargo update --workspace` touches only workspace
  # crates — dependency versions stay pinned. Pushes made with GITHUB_TOKEN
  # never trigger workflows, so this cannot loop; when release-please
  # rewrites its branch on the next push to main, this job re-applies.
  sync-cargo-lock:
    needs: [release-please]
    if: needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Re-lock the workspace crate at the bumped version
        run: cargo update --workspace --manifest-path src-tauri/Cargo.toml
      - name: Commit Cargo.lock to the release PR
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Cargo.lock with the release version" -- src-tauri/Cargo.lock
          git push

  build:
    needs: [release-please]
    # Run when release-please just created a (draft) release, or on a manual
    # rebuild. `always()` keeps this job eligible when release-please was
    # skipped (workflow_dispatch).
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    # macos-latest is Apple Silicon (aarch64) — matches the app's only target.
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      # Step-level `if:` cannot read secrets; job-level env can.
      HAVE_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - name: Resolve release tag + commit
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            # A published release's tag is the commit to build.
            REF="$TAG"
          else
            TAG="${{ needs.release-please.outputs.tag_name }}"
            # Build the exact commit release-please tagged (the tag itself
            # may still be propagating when this job starts).
            REF="${{ needs.release-please.outputs.sha }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Building $TAG from $REF"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.rel.outputs.ref }}

      - name: Verify tag matches app version
        run: |
          TAG_VERSION="${{ steps.rel.outputs.version }}"
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::Release ${{ steps.rel.outputs.tag }} does not match tauri.conf.json version $CONF_VERSION. release-please should have bumped it — check release-please-config.json extra-files."
            exit 1
          fi

      - name: Install meson/ninja (webrtc-audio-processing build deps)
        run: brew install meson ninja pkg-config

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Release-profile artifacts never match CI's debug cache, and caches
      # aren't shared across tags, so this is only a hit when the same release
      # is rebuilt (workflow_dispatch). Cheap enough to keep.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v1-rust
          cache-directories: ~/Library/Caches/sherpa-rs

      # Same key as the CI `sidecar` job (main), which this run can read.
      # restore-keys lets a build-script edit reuse the vendored clone; the
      # script fetches/checks out the pinned ref and CMake rebuilds
      # incrementally.
      - name: Cache llama.cpp build
        uses: actions/cache@v5
        with:
          path: |
            .llama.cpp
            src-tauri/binaries
          key: llama-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-llama-server.sh') }}
          restore-keys: |
            llama-${{ runner.os }}-${{ runner.arch }}-

      - run: npm ci

      # A full-match target/ restore marks the sherpa-rs-sys build script
      # fresh, so it never re-copies its dylibs into target/release — and
      # rust-cache prunes them from the saved cache. fix-bundle.sh needs
      # them there to bundle into the .app; it fails hard if they're
      # missing. Re-materialize from the cached download dir. No-op on a
      # fresh build (the build script copies them itself; -n keeps those).
      - name: Restore sherpa dylibs into target/release
        run: |
          mkdir -p src-tauri/target/release
          find ~/Library/Caches/sherpa-rs -name '*.dylib' -exec cp -n {} src-tauri/target/release/ \; || true

      # Throwaway keychain for the Developer ID certificate; deleted in the
      # cleanup step below. The API key goes to $RUNNER_TEMP for notarytool.
      - name: Import signing certificate
        if: env.HAVE_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -k "$KC" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KC"
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_P8_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # Builds the llama-server sidecar, runs `tauri build`, then
      # scripts/fix-bundle.sh (copies sherpa/onnxruntime dylibs into the .app,
      # signs, re-creates the DMG from the fixed bundle, and notarizes +
      # staples when the NOTARY_* variables are set). Empty secrets leave the
      # variables empty, which the script treats as "ad-hoc, no notarization".
      - name: Build app
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: npm run tauri:build

      - name: Remove signing keychain
        if: always() && env.HAVE_CERT == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Collect artifacts
        run: |
          VERSION="${{ steps.rel.outputs.version }}"
          DMG="src-tauri/target/release/bundle/dmg/LilNotes_${VERSION}_aarch64.dmg"
          if [ ! -f "$DMG" ]; then
            echo "::error::Expected DMG not found: $DMG"
            ls -la src-tauri/target/release/bundle/dmg/ || true
            exit 1
          fi
          mkdir -p dist-release
          cp "$DMG" dist-release/
          cd dist-release
          shasum -a 256 ./* > checksums.txt
          cat checksums.txt

      - name: Upload assets
        run: gh release upload "${{ steps.rel.outputs.tag }}" dist-release/* --clobber

      # release-please wrote the changelog into the release body; append the
      # install instructions once (idempotent on manual rebuilds). The text
      # depends on whether this build was signed + notarized.
      - name: Add install notes
        run: |
          TAG="${{ steps.rel.outputs.tag }}"
          gh release view "$TAG" --json body -q .body > release-notes.md
          if ! grep -q '^## Installation' release-notes.md; then
            if [ "$HAVE_CERT" = "true" ]; then
              cat >> release-notes.md <<'NOTES'

          ## Installation

          1. Download `LilNotes_*_aarch64.dmg` below (Apple Silicon, macOS 15+ only).
          2. Open the DMG and drag **LilNotes** to Applications.
          3. Launch it. The app is signed with a Developer ID and notarized by Apple.

          ### Verify your download (optional)

          ```sh
          shasum -a 256 -c checksums.txt
          ```
          NOTES
            else
              cat >> release-notes.md <<'NOTES'

          ## Installation

          1. Download `LilNotes_*_aarch64.dmg` below (Apple Silicon, macOS 15+ only).
          2. Open the DMG and drag **LilNotes** to Applications.

          ### First launch (important)

          This build is not notarized by Apple, so macOS will refuse to open
          it with a "damaged" or "cannot be opened" warning. Two ways past it:

          - Run this once in Terminal, then launch normally:

            ```sh
            xattr -cr /Applications/LilNotes.app
            ```

          - Or: try to open the app, then go to **System Settings → Privacy &
            Security**, scroll down, and click **Open Anyway**.

          ### Verify your download (optional)

          ```sh
          shasum -a 256 -c checksums.txt
          ```
          NOTES
            fi
          fi
          gh release edit "$TAG" --notes-file release-notes.md
