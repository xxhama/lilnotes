# cargo-deny config. CI runs `cargo deny check licenses` only: a new
# dependency whose license is not on the allowlist fails the build. Every
# entry is compatible with redistribution under this project's AGPL-3.0.
# (`advisories` / `bans` are deliberately not enabled here — they would make
# unrelated PRs fail whenever a new RUSTSEC entry lands.)
[graph]
targets = ["aarch64-apple-darwin"]

[licenses]
allow = [
    "0BSD",
    "AGPL-3.0-only", # this crate
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

# The webrtc-audio-processing crates declare `license-file = "COPYING"` with no
# SPDX expression; COPYING is Google's BSD-3-Clause notice.
[[licenses.clarify]]
crate = "webrtc-audio-processing"
expression = "BSD-3-Clause"
license-files = [{ path = "COPYING", hash = 0x1 }]

[[licenses.clarify]]
crate = "webrtc-audio-processing-sys"
expression = "BSD-3-Clause"
license-files = [{ path = "COPYING", hash = 0x1 }]

[[licenses.clarify]]
crate = "webrtc-audio-processing-config"
expression = "BSD-3-Clause"
license-files = [{ path = "COPYING", hash = 0x1 }]
