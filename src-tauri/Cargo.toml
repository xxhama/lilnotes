[package]
name = "lilnotes"
version = "0.1.0"
description = "Local-first meeting notes: on-device transcription, diarization, and summaries."
authors = ["Johnny Xhama"]
edition = "2021"

[lib]
name = "lilnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- audio capture (M2) ---
cpal = "0.18"                 # microphone capture
hound = "3.5"                 # WAV writing
crossbeam-channel = "0.5"     # realtime-ish handoff between audio callbacks and writers
chrono = "0.4"                # session ids / timestamps

# Apple framework bindings (objc2 project). Default features enable the full API.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio = "0.3"       # process taps, aggregate devices, HAL properties
objc2-core-audio-types = "0.3" # AudioBufferList, ASBD, AudioTimeStamp
objc2-av-foundation = "0.3"    # AVCaptureDevice for mic TCC status/request

[profile.release]
lto = true
codegen-units = 1
