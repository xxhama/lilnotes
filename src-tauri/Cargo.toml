[package]
name = "lilnotes"
version = "0.3.0"
description = "Local-first meeting notes: on-device transcription, diarization, and summaries."
authors = ["Johnny Xhama"]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/xxhama/lilnotes"
homepage = "https://github.com/xxhama/lilnotes"
readme = "../README.md"

[lib]
name = "lilnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["time", "net"] }  # time: async sidecar startup; net: MCP TcpListener
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- persistence (M5) + encryption at rest (M9) ---
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
security-framework = "3.7"   # macOS Keychain for the DB key
security-framework-sys = "2.17"  # errSecItemNotFound constant for Keychain error matching
rand = "0.8"                 # OsRng for key generation

# --- audio capture (M2) ---
cpal = "0.18"                 # microphone capture
hound = "3.5"                 # legacy .wav reads (pre-FLAC recordings) + WAV test fixtures

# --- lossless recording format ---
# Channel files are FLAC (see audio/codec.rs). libFLAC's streaming encoder via
# libflac-sys, built from source with cmake (already required by whisper-rs)
# and linked statically; no Ogg. claxon is a pure-Rust decoder.
flac-bound = { version = "0.5", default-features = false, features = ["libflac-noogg"] }
claxon = "0.4"
crossbeam-channel = "0.5"     # realtime-ish handoff between audio callbacks and writers
chrono = "0.4"                # session ids / timestamps

# --- acoustic echo cancellation (AEC) ---
# WebRTC AudioProcessing (AEC3 + NS). `bundled` compiles Google's C++ APM from
# source (~1-2 min added to the first build). Pin to ~2.1: minor versions can
# break the config API. `experimental-aec3-config` exposes the fine-grained
# AEC3 suppressor/filter/delay knobs we tune per aggressiveness preset.
webrtc-audio-processing = { version = "~2.1", features = ["bundled", "experimental-aec3-config"] }
# Offline AEC (Tier 3): partitioned-block frequency-domain adaptive filter
# (PB-FDAF / NLMS) using system.wav as the exact echo reference. realfft gives
# a simple real-input FFT for the frequency-domain filter arithmetic.
realfft = "1"
# Complex type used by realfft's spectra (pinned to 0.3 to match realfft 1.x's
# dependency, so the `Complex32` values flow through without a type mismatch).
num-complex = "0.3"

# --- diarization (M4) ---
sherpa-rs = "0.6"  # sherpa-onnx: pyannote segmentation + CAM++ embeddings

# Native LLM inference runs in a separate process (llama-server, llama.cpp's
# official HTTP server) to avoid ggml-metal symbol collision with whisper-rs.
# The shell plugin spawns it; sidecar.rs talks to its HTTP API.

# --- transcription (M3) ---
whisper-rs = { version = "0.16", features = ["metal"] }  # whisper.cpp, Metal backend
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }  # model downloads + Ollama
futures-util = "0.3"  # stream combinators for Ollama NDJSON streaming

# Apple framework bindings (objc2 project). Default features enable the full API.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio = "0.3"       # process taps, aggregate devices, HAL properties
objc2-core-audio-types = "0.3" # AudioBufferList, ASBD, AudioTimeStamp
objc2-av-foundation = "0.3"    # AVCaptureDevice for mic TCC status/request
objc2-avf-audio = "0.3"        # AVAudioEngine voice-processed mic (AEC)

# --- MCP server (read-only, localhost, off by default) ---
# rmcp = official Rust MCP SDK; Streamable HTTP transport is a tower service
# mounted in axum. The app already carries hyper/tower via reqwest, so axum
# is the only genuinely new HTTP dependency.
rmcp = { version = "3.2", features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
schemars = "1"       # JsonSchema derives for MCP tool parameter structs
tokio-util = "0.7"   # CancellationToken for MCP server shutdown
subtle = "2"         # constant-time bearer-token compare
tauri-plugin-clipboard-manager = "2"  # "Copy" button for the MCP connect snippet

[dev-dependencies]
# MCP integration test drives the server with plain JSON-RPC over reqwest
# (the app's existing 0.12 client), so no rmcp client feature is needed.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }  # ServiceExt::oneshot for router auth tests

[profile.release]
lto = true
codegen-units = 1
