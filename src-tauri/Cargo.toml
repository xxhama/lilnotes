[package]
name = "lilnotes"
version = "0.1.0"
description = "Local-first meeting notes: on-device transcription, diarization, and summaries."
authors = ["Johnny Xhama"]
edition = "2021"

[lib]
name = "lilnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
